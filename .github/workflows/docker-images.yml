name: Build server Docker images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOCKER_BUILD_RECORD_UPLOAD: false

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Discover images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build image matrix from Compose
        id: matrix
        shell: bash
        env:
          BACKEND_ENV_FILE: /dev/null
          TELEGRAM_ENV_FILE: /dev/null
          VOICE_ENV_FILE: /dev/null
          CHATTER_MANAGER_ENV_FILE: /dev/null
          CHATTER_IMAGE_PREFIX: chatter
          CHATTER_IMAGE_TAG: local
          CHATTER_PUBLIC_HOST: localhost
        run: |
          images="$(
            docker compose --profile '*' config --no-path-resolution --format json |
              jq -c '[
                .services | to_entries[] |
                select(.value.build != null) |
                {
                  image: (.value.image | capture("^chatter-(?<name>.+):local$").name),
                  context: .value.build.context,
                  dockerfile: (
                    if .value.build.context == "." then .value.build.dockerfile
                    else (.value.build.context + "/" + .value.build.dockerfile)
                    end
                  )
                }
              ]'
          )"
          jq -e 'length > 0 and any(.[]; .image == "manager")' <<<"$images" >/dev/null
          echo "value={\"include\":${images}}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: prepare
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Encode changelog
        id: changelog
        shell: bash
        run: |
          jq -e '.changes as $c | ($c | type) == "object" and ($c.en | type) == "array" and ($c.ru | type) == "array" and all($c.en[]; type == "string") and all($c.ru[]; type == "string") and ($c.en | length) == ($c.ru | length)' server-changelog.json >/dev/null
          echo "value=$(base64 -w 0 server-changelog.json)" >> "$GITHUB_OUTPUT"

      - name: Sanitize branch tag
        id: branch
        shell: bash
        run: |
          slug="$(printf '%s' "${GITHUB_REF_NAME}" | tr '/' '-' | tr -cd 'A-Za-z0-9_.-' | cut -c1-100)"
          if [ -z "$slug" ]; then
            echo "Branch tag is empty after sanitization" >&2
            exit 1
          fi
          echo "tag=$slug" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/chatter-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=raw,value=${{ steps.branch.outputs.tag }}
          labels: |
            io.chatter.server.changelog-base64=${{ steps.changelog.outputs.value }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Delete old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: chatter-${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 3
