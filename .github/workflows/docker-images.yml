name: Build server Docker images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOCKER_BUILD_RECORD_UPLOAD: false

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend-api
            dockerfile: ./backend-api/Dockerfile
          - image: telegram-bot
            context: .
            dockerfile: ./Dockerfile.bot
          - image: webapp-notes
            context: ./webapp-notes
            dockerfile: ./webapp-notes/Dockerfile
          - image: voice
            context: ./voice-service
            dockerfile: ./voice-service/Dockerfile
          - image: admin-panel
            context: ./admin-panel
            dockerfile: ./admin-panel/Dockerfile
          - image: manager
            context: ./chatter-manager
            dockerfile: ./chatter-manager/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Encode changelog
        id: changelog
        shell: bash
        run: |
          jq -e '.changes as $c | ($c | type) == "object" and ($c.en | type) == "array" and ($c.ru | type) == "array" and all($c.en[]; type == "string") and all($c.ru[]; type == "string") and ($c.en | length) == ($c.ru | length)' server-changelog.json >/dev/null
          echo "value=$(base64 -w 0 server-changelog.json)" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/chatter-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            io.chatter.server.changelog-base64=${{ steps.changelog.outputs.value }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Delete old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: chatter-${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 1
