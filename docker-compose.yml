services:
  backend:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    image: chatter-backend:local
    restart: unless-stopped
    env_file:
      - "${BACKEND_ENV_FILE:-./backend-api/.env}"
    environment:
      NODE_ENV: production
      BACKEND_API_PORT: 3050
      API_DB_PATH: /data/chatter.db
      UPLOADS_DIR: /data/uploads
    ports:
      - "${BACKEND_PORT:-3050}:3050"
    volumes:
      - chatter_backend_data:/data
      - chatter_backend_updates:/app/updates
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3050/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  telegram-bot:
    profiles:
      - telegram
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: chatter-telegram-bot:local
    restart: unless-stopped
    env_file:
      - "${TELEGRAM_ENV_FILE:-./.env}"
    environment:
      NODE_ENV: production
      BACKEND_API_BASE_URL: http://backend:3050
    depends_on:
      backend:
        condition: service_healthy

  webapp-notes:
    profiles:
      - telegram
    build:
      context: ./webapp-notes
      dockerfile: Dockerfile
    image: chatter-webapp-notes:local
    restart: unless-stopped
    env_file:
      - "${TELEGRAM_ENV_FILE:-./.env}"
    environment:
      NODE_ENV: production
      NOTES_DB_PATH: /data/chatter.db
    ports:
      - "${NOTES_PORT:-3001}:3001"
    volumes:
      - chatter_backend_data:/data
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

  voice:
    profiles:
      - voice
    build:
      context: ./voice-service
      dockerfile: Dockerfile
    image: chatter-voice:local
    restart: unless-stopped
    env_file:
      - path: "${VOICE_ENV_FILE:-./voice-service/.env}"
        required: false
    environment:
      NODE_ENV: production
      VOICE_API_PORT: 3030
      WHISPER_BIN: /opt/whisper/whisper-cli
      WHISPER_MODEL: /opt/whisper/ggml-small.bin
      PYTHON_BIN: /opt/venv/bin/python
      PIPER_MODEL_PATH: /opt/models/piper/en_US-lessac-medium.onnx
    ports:
      - "${VOICE_PORT:-3030}:3030"
    volumes:
      - chatter_voice_model_cache:/home/node/.cache/torch
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3030/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

  admin-panel:
    profiles:
      - admin
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    image: chatter-admin-panel:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

  chatter-manager:
    profiles:
      - admin
    build:
      context: ./chatter-manager
      dockerfile: Dockerfile
    image: chatter-manager:local
    restart: unless-stopped
    env_file:
      - path: "${CHATTER_MANAGER_ENV_FILE:-./.chatter/manager.env}"
        required: false
    environment:
      NODE_ENV: production
      ADMIN_INTERNAL_PORT: 8080
      ADMIN_PANEL_URL: http://admin-panel:3000
      CHATTER_CONFIG_DIR: /config
      CHATTER_COMPOSE_FILE: /workspace/docker-compose.yml
      COMPOSE_PROJECT_NAME: chatter
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-8080}:8080"
    volumes:
      - "${CHATTER_CONFIG_DIR:-./.chatter}:/config"
      - .:/workspace:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      admin-panel:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const tls=process.env.ADMIN_TLS==='1';const lib=require(tls?'node:https':'node:http');const req=lib.get({hostname:'127.0.0.1',port:8080,path:'/health',rejectUnauthorized:false},res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  chatter_backend_data:
  chatter_backend_updates:
  chatter_voice_model_cache:
